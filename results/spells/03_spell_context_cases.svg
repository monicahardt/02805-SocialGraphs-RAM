   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #287c83" x="87.153488" y="554.695935" transform="rotate(-0 87.153488 554.695935)">“Cruciol”</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(87.153488 623.830142)">The book identifies Bellatrix as the caster and Neville as the victim. This</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(87.153488 638.830142)">is a confirmed source-attribution error.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(87.153488 659.301273)">Story 5 · parsed record 22845</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(87.153488 670.103734)">Reviewed speaker: Bellatrix Lestrange</text>
   </g>
