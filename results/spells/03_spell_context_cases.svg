   <g id="text_1">
    <text style="font-size: 18px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #243e3b" x="87.153488" y="215.304414" transform="rotate(-0 87.153488 215.304414)">A recollection, not a casting</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #287c83" transform="translate(87.153488 255.035956)">“Fred and George were right, weren’t they? He really knows his</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #287c83" transform="translate(87.153488 273.035956)">stuff, Moody, doesn’t he? When he did Avada Kedavra, the way that</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #287c83" transform="translate(87.153488 291.035956)">spider just died, just snuffed it right —”</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(87.153488 324.363913)">Ron describes what Moody did to a spider. Counting the incantation in this</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(87.153488 339.363913)">line as Ron casting it would be wrong.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(87.153488 360.803794)">Story 4 · parsed record 10623</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(87.153488 371.606255)">Reviewed speaker: Ron Weasley</text>
   </g>
  </g>
