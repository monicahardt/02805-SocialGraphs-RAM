   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #287c83" x="601.283721" y="255.035956" transform="rotate(-0 601.283721 255.035956)">“Imperiol”</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(601.283721 324.363913)">The original book identifies Harry casting at the Gringotts goblin. The</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(601.283721 339.363913)">supplied dialogue labels the speaker Ted Tonks.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(601.283721 360.803794)">Story 7 · parsed record 33745</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(601.283721 371.606255)">Reviewed speaker: Harry Potter</text>
   </g>
  </g>
