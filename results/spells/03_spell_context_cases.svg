   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #287c83" x="601.283721" y="553.533435" transform="rotate(-0 601.283721 553.533435)">“Imperio.”</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(601.283721 622.861392)">The book identifies McGonagall casting at Amycus. The supplied dialogue</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243e3b" transform="translate(601.283721 638.830142)">labels this line Ted Tonks.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(601.283721 659.301273)">Story 7 · parsed record 34275</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(601.283721 670.103734)">Reviewed speaker: Minerva McGonagall</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #66796f" x="59.4" y="32.149656" transform="rotate(-0 59.4 32.149656)">FROM PAGE TO SCREEN    /    08 · READ THE CONTEXT</text>
  </g>
  <g id="text_18">
   <text style="font-size: 27px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #243e3b" x="59.4" y="71.995781" transform="rotate(-0 59.4 71.995781)">Saying the words is only the beginning</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(59.4 99.476344)">Four checked passages show why word counts need context. The Unforgivable Curses are Avada Kedavra, Crucio and Imperio.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(59.4 115.226344)">Review labels are local annotations; the original datasets have not been edited.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(59.4 756.809438)">These four reviewed examples are selected to explain interpretation problems. They are not an exhaustive casting inventory or a hero/villain comparison.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66796f" transform="translate(59.4 770.184281)">Original lines, reviewed actors and references to the surrounding book text are in manual_reviews.csv; every detected mention is in spell_mentions.csv.</text>
  </g>
 </g>
