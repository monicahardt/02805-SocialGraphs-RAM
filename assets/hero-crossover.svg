<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Comic-inspired superhero social graph city</title>
  <desc id="desc">A colorful comic city scene with red and blue webs, yellow bat silhouettes, electric lightning, and glowing graph nodes.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="36%" r="70%">
      <stop offset="0" stop-color="#3d4cff"/>
      <stop offset="0.28" stop-color="#16217a"/>
      <stop offset="0.62" stop-color="#0b0e30"/>
      <stop offset="1" stop-color="#05050b"/>
    </radialGradient>
    <linearGradient id="comicRed" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff3048"/>
      <stop offset="1" stop-color="#a5001e"/>
    </linearGradient>
    <linearGradient id="comicBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6ee8ff"/>
      <stop offset="1" stop-color="#1755ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#ffb400"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1400" height="900" fill="url(#sky)"/>
  <rect width="1400" height="900" fill="url(#halftone)" opacity="0.9"/>

