<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Lightning striking a glowing social graph</title>
  <desc id="desc">Electric blue and gold lightning strikes through colorful graph nodes and edges.</desc>
  <defs>
    <linearGradient id="storm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1a5b"/>
      <stop offset="0.55" stop-color="#11152e"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="620" fill="url(#storm)"/>
